<script>

function t(s){return(DB&&DB.prof&&DB.prof.lang=='en'&&EN[s])||s}

function load(){try{DB=JSON.parse(localStorage.getItem(KEY)||'')}catch(e){DB=null}
 if(!DB||!DB.w||!DB.w.length)DB={w:[newW('')],cur:0,prof:defProf(),debts:[]};
 DB.prof=Object.assign(defProf(),DB.prof||{});DB.debts=DB.debts||[];
 DB.w.forEach(function(w){w.id=w.id||'l'+newId();w.d=w.d||{};w.notes=w.notes||[];w.ap=w.ap||{};w.log=w.log||[];w.wage=+w.wage||0;w.cur=w.cur||'';w.site=w.site||''});
 if(!DB.cur||DB.cur>=DB.w.length)DB.cur=0;sel=today();var n=new Date();vy=n.getFullYear();vm=n.getMonth()}

 if(k=='m'){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}

 for(var k in w.d){if(k<a||k>b)continue;var e=w.d[k];if(e.t){r.n[e.t]=(r.n[e.t]||0)+1;r.days+=dayVal(e)}

 if(!e||(!e.t&&!(e.p&&e.p.length)&&!e.o))return s+'، '+t('لا يوجد تسجيل');
 if(e.t)s+='، '+tl(e.t);(e.p||[]).forEach(function(a,i){s+='، '+t(KDEF[(e.k&&e.k[i])||'s'])+' '+fm(a)+' '+cu(cw())});

// ---- فهم الأوامر الصوتية والمكتوبة ----

var MONS=MN.map(function(a,i){return[a,MEN[i].toLowerCase(),MEN[i].slice(0,3).toLowerCase()].concat([['كانون الثاني'],['شباط'],['آذار'],['نيسان','ابريل'],['أيار'],['حزيران'],['تموز'],['آب','اغسطس'],['أيلول'],['تشرين الأول'],['تشرين الثاني'],['كانون الأول']][i])});
function parseCmd(raw,typed){var s=nz(String(raw)),r={k:null,ty:null,pays:[],ot:0},now=new Date(),dm=null;
 for(var i=0;i<12&&!dm;i++)MONS[i].forEach(function(nm){if(dm)return;nm=nm.toLowerCase();if(s.indexOf(nm)<0)return;
  var m=s.match(new RegExp('(\\d{1,2})\\s*(?:of\\s*|من\\s*)?'+nm+'|'+nm+'\\s*(\\d{1,2})'));if(m){dm=new Date(now.getFullYear(),i,+(m[1]||m[2]));s=s.replace(m[0],' ')}});
 if(!dm){var m2=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);if(m2){dm=new Date(now.getFullYear(),+m2[2]-1,+m2[1]);s=s.replace(m2[0],' ')}}
 if(!dm&&/أمس|امس|yesterday/.test(s)){dm=new Date(now);dm.setDate(now.getDate()-1)}
 r.k=dm?key(dm):(typed?sel:today());
 var o=s.match(/(?:اضافي|إضافي|اضافية|overtime)\D{0,12}?(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:ساعات|ساعة|hours?|hrs?|घंटे)/);
 if(o){r.ot=+(o[1]||o[2]);s=s.replace(o[0],' ')}
 ['h','s','a','x','w'].forEach(function(c){if(!r.ty&&KW.ty[c].test(s))r.ty=c});
 var a=s.match(/(\d+(?:\.\d+)?)/),kd=null;['a','b','d','s'].forEach(function(c){if(!kd&&KW.kind[c].test(s))kd=c});
 if(a&&(kd||(!r.ty&&KW.cur.test(s))))r.pays.push({a:+a[1],kind:kd||'s'});
 if(!r.ty&&!r.pays.length&&!r.ot)return null;return r}
function applyCmd(raw,typed){var r=parseCmd(raw,typed);
 if(!r){toast(t('لم أفهم')+': «'+raw+'»');say(t('لم أفهم، أعد المحاولة'));return false}
 if(r.ty)setType(r.k,r.ty);r.pays.forEach(function(p){addPay(r.k,p.a,p.kind)});if(r.ot)setOT(r.k,r.ot);
 sel=r.k;var d=pd(r.k);vy=d.getFullYear();vm=d.getMonth();render();toast('✔ '+dayText(r.k));say(t('تم التسجيل')+'. '+dayText(r.k));return true}

async function boot(){
 const last=localStorage.getItem('cl_uid');if(last&&last!==U.uid)resetLocal();localStorage.setItem('cl_uid',U.uid);
 const ref=doc(fs,'users',U.uid);let s=await getDoc(ref);
 if(!s.exists()){const pd=JSON.parse(localStorage.getItem('cl_pending')||'null');if(!pd){needProf=true;return}await mk(pd);s=await getDoc(ref)}
 P=s.data();const p=pf();p.role=P.role;window.LINKED=!!P.adminId;
 if(P.role=='admin'){p.n=P.name||p.n;p.phone=P.phone||p.phone;if(P.photo)p.ph=P.photo;persist();await ensureCode();adminWatch()}else workerWatch();
 watchDebts()}
async function mk(pd){const b={role:pd.role,name:pd.name||'',phone:pd.phone||'',photo:pd.photo||'',email:U.email};
 if(pd.role=='worker'&&pd.code){const c=pd.code.toUpperCase(),d=await getDoc(doc(fs,'codes',c));if(d.exists()){b.adminId=d.data().adminId;b.joinCode=c}else toast(t('كود المدير غير صحيح، يمكنك الانضمام لاحقاً'))}
 await setDoc(doc(fs,'users',U.uid),b);localStorage.removeItem('cl_pending')}
async function ensureCode(){const q=await getDocs(query(collection(fs,'codes'),where('adminId','==',U.uid)));if(!q.empty){myCode=q.docs[0].id;return}
 const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<5;i++){const r=crypto.getRandomValues(new Uint8Array(6)),c=[...r].map(x=>A[x%32]).join('');try{await setDoc(doc(fs,'codes',c),{adminId:U.uid});myCode=c;return}catch(e){}}}
function watchW(id){if(watched.has(id))return;watched.add(id);const W=()=>DB.w.find(x=>x.id==id),C=n=>collection(fs,'workers',id,n);
 unsubs.push(onSnapshot(C('days'),sn=>{const w=W();if(!w)return;const nd={};
  sn.forEach(x=>{const d=x.data(),e={p:d.p||[],k:d.k||[]};if(d.t)e.t=d.t;if(d.o)e.o=d.o;nd[x.id]=e;sent[id+x.id]=pack(e)});
  for(const k in w.d)if(!(k in nd)){if(sent[id+k]===undefined)nd[k]=w.d[k];else delete sent[id+k]}
  w.d=nd;persist();render()}));
 unsubs.push(onSnapshot(C('notes'),sn=>{const w=W();if(!w)return;const ns=sentN[id]||(sentN[id]=new Set()),cl=[];sn.forEach(x=>{ns.add(x.id);cl.push(x.data())});
  const ids=new Set(cl.map(n=>hash(n.x+n.d)));w.notes=cl.concat((w.notes||[]).filter(n=>!ids.has(hash(n.x+n.d))));persist();render()}));
 unsubs.push(onSnapshot(C('approvals'),sn=>{const w=W();if(!w)return;sn.forEach(x=>{w.ap[x.id]=x.data();sentA[id+x.id+'m']=JSON.stringify([x.data().m,x.data().s]);sentA[id+x.id+'w']=String(x.data().w||'')});persist();render()}));
 unsubs.push(onSnapshot(C('log'),sn=>{const w=W();if(!w)return;const have=new Set((w.log||[]).map(l=>l.at));
  sn.forEach(x=>{const d=x.data();sentL.add(id+d.at);if(!have.has(d.at))w.log.push({d:d.d,a:d.a,at:d.at,n:d.n||''})});
  w.log.sort((a,b)=>a.at-b.at);if(w.log.length>200)w.log=w.log.slice(-200);persist();render()}))}
function workerWatch(){const w=cw(),id=U.uid;w.id=id;w.cl=1;w.n=P.name||w.n;w.phone=P.phone||w.phone;if(P.photo)w.ph=P.photo;if(P.wage)w.wage=P.wage;if(P.cur)w.cur=P.cur;if(P.site)w.site=P.site;
 lw[id]=JSON.stringify([P.wage||0,P.cur||'',P.site||'']);persist();watchW(id);
 unsubs.push(onSnapshot(doc(fs,'users',id),s=>{const d=s.data();if(!d)return;P=d;window.LINKED=!!d.adminId;const j=JSON.stringify([+d.wage||0,d.cur||'',d.site||'']);
  if(d.adminId||JSON.stringify([+w.wage||0,w.cur||'',w.site||''])==lw[id]){w.wage=+d.wage||0;w.cur=d.cur||'';w.site=d.site||'';lw[id]=j}persist();render()}));push()}
function adminWatch(){
 try{if(!localStorage.getItem('wdb_local'))localStorage.setItem('wdb_local',JSON.stringify(DB))}catch(e){}
 unsubs.push(onSnapshot(query(collection(fs,'users'),where('adminId','==',U.uid)),sn=>{const ws=[];
  sn.forEach(x=>{const d=x.data();let o=DB.w.find(w=>w.id==x.id&&w.cl);
   if(!o){o=newW(d.name||d.email);o.id=x.id;o.cl=1;lw[x.id]=JSON.stringify([+d.wage||0,d.cur||'',d.site||'']);o.wage=+d.wage||0;o.cur=d.cur||'';o.site=d.site||''}
   o.n=d.name||d.email;o.phone=d.phone||'';o.ph=d.photo||'';
   if(JSON.stringify([+o.wage||0,o.cur||'',o.site||''])==lw[x.id]){o.wage=+d.wage||0;o.cur=d.cur||'';o.site=d.site||'';lw[x.id]=JSON.stringify([o.wage,o.cur,o.site])}
   ws.push(o)});
  if(ws.length){const c=cw();DB.w=ws;DB.cur=Math.max(0,ws.findIndex(w=>c&&w.id==c.id));ws.forEach(w=>watchW(w.id))}
  persist();render()}))}
function watchDebts(){unsubs.push(onSnapshot(collection(fs,'users',U.uid,'debts'),sn=>{const cl=[];sn.forEach(x=>{const d=x.data();d.id=x.id;cl.push(d);sentD[x.id]=JSON.stringify(dpk(d))});
 const ids=new Set(cl.map(d=>d.id));DB.debts=cl.concat(DB.debts.filter(d=>!ids.has(d.id)&&sentD[d.id]===undefined));persist();render()}))}
async function push(){
 if(!U||!P)return;const p=pf(),w=cw();if(!w)return;
 const meo=P.role=='worker'?{name:w.n||'',phone:w.phone||'',photo:w.ph||''}:{name:p.n||'',phone:p.phone||'',photo:p.ph||''};
 if(meo.photo.length>19000)meo.photo='';const j=JSON.stringify(meo);if(lp.j!==j){lp.j=j;updateDoc(doc(fs,'users',U.uid),meo).catch(()=>{lp.j=''})}
 const tg=P.role=='admin'?DB.w.filter(x=>x.cl):(!P.adminId?[w]:[]);
 tg.forEach(x=>{const uid=P.role=='admin'?x.id:U.uid,jw=JSON.stringify([+x.wage||0,x.cur||'',x.site||'']);if(lw[uid]!==undefined&&lw[uid]!==jw){lw[uid]=jw;updateDoc(doc(fs,'users',uid),{wage:+x.wage||0,cur:String(x.cur||'').slice(0,6),site:String(x.site||'').slice(0,30)}).catch(()=>{delete lw[uid]})}});
 const dk=P.role=='admin';
 if(P.role=='worker'||w.cl){const id=P.role=='worker'?U.uid:w.id;
  for(const k in w.d){const e=w.d[k],j2=pack(e);if(sent[id+k]===j2)continue;sent[id+k]=j2;const o={p:e.p||[],k:e.k||[],by:U.uid,at:serverTimestamp()};if(e.t)o.t=e.t;if(e.o)o.o=e.o;
   setDoc(doc(fs,'workers',id,'days',k),o).catch(()=>{delete sent[id+k]})}
  for(const sk of Object.keys(sent))if(sk.startsWith(id)&&sk.length==id.length+10&&!((sk.slice(id.length))in w.d)){delete sent[sk];deleteDoc(doc(fs,'workers',id,'days',sk.slice(id.length))).catch(()=>{})}
  for(const ws in w.ap){const a=w.ap[ws];
   if(dk){const jm=JSON.stringify([a.m,a.s]);if(a.m&&sentA[id+ws+'m']!==jm){sentA[id+ws+'m']=jm;setDoc(doc(fs,'workers',id,'approvals',ws),{m:a.m,s:a.s},{merge:true}).catch(()=>{delete sentA[id+ws+'m']})}}
   else if(a.w&&sentA[id+ws+'w']!==String(a.w)){sentA[id+ws+'w']=String(a.w);updateDoc(doc(fs,'workers',id,'approvals',ws),{w:a.w}).catch(()=>{delete sentA[id+ws+'w']})}}
  (w.log||[]).forEach(l=>{if(sentL.has(id+l.at))return;sentL.add(id+l.at);setDoc(doc(fs,'workers',id,'log',String(l.at)),{d:String(l.d),a:String(l.a),at:l.at,n:String(l.n||'').slice(0,40),u:U.uid}).catch(()=>sentL.delete(id+l.at))});
  if(P.role=='worker'){const ns=sentN[id]||(sentN[id]=new Set()),ids=new Set();
   (w.notes||[]).forEach(n=>{const i=hash(n.x+n.d);ids.add(i);if(!ns.has(i)){ns.add(i);setDoc(doc(fs,'workers',id,'notes',i),{x:String(n.x).slice(0,500),d:String(n.d)}).catch(()=>ns.delete(i))}});
   ns.forEach(i=>{if(!ids.has(i)){ns.delete(i);deleteDoc(doc(fs,'workers',id,'notes',i)).catch(()=>{})}})}}
 const ids2=new Set();DB.debts.forEach(d=>{ids2.add(d.id);const jd=JSON.stringify(dpk(d));if(sentD[d.id]!==jd){sentD[d.id]=jd;setDoc(doc(fs,'users',U.uid,'debts',d.id),dpk(d)).catch(()=>{delete sentD[d.id]})}});
 for(const i of Object.keys(sentD))if(!ids2.has(i)){delete sentD[i];deleteDoc(doc(fs,'users',U.uid,'debts',i)).catch(()=>{})}}
// ---- الحساب ----
const mode=m=>{am=m;render()};
function role(r){sr=r;$('rA').className=r=='admin'?'bw':'';$('rW').className=r=='worker'?'bw':'';if($('cw'))$('cw').style.display=r=='worker'?'':'none'}
async function signup(){const nm=$('an').value.trim(),em=$('ae').value.trim(),pw=$('ap').value;
 if(!nm||!em||pw.length<6){toast(t('اكتب الاسم والبريد وكلمة سر من 6 أحرف على الأقل'));return}
 try{const c=await createUserWithEmailAndPassword(auth,em,pw);const ph=window.nph||'';
  localStorage.setItem('cl_pending',JSON.stringify({role:sr,name:nm,phone:$('aph2').value.trim(),code:sr=='worker'&&$('ac')?$('ac').value.trim():'',photo:ph.length<19000?ph:''}));
  await sendEmailVerification(c.user);toast('✔ '+t('أُرسلت رسالة تأكيد إلى بريدك'))}catch(e){toast(err(e))}}
async function login(){const em=$('ae').value.trim(),pw=$('ap').value;if(!em||!pw){toast(t('اكتب البريد وكلمة السر'));return}try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){toast(err(e))}}
async function google(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast(err(e))}}
async function forgot(){const em=$('ae').value.trim();if(!em){toast(t('اكتب بريدك أولاً'));return}try{await sendPasswordResetEmail(auth,em);toast('✔ '+t('أُرسل رابط تغيير كلمة السر'))}catch(e){toast(err(e))}}
async function resend(){try{await sendEmailVerification(auth.currentUser);toast('✔ '+t('أُعيد إرسال رسالة التأكيد'))}catch(e){toast(err(e))}}
async function check(){const u=auth.currentUser;if(!u)return;await u.reload();await u.getIdToken(true);
 if(u.emailVerified){U=u;try{await boot()}catch(e){toast('تعذر الاتصال')}setCS();render();toast('✔ '+t('تم تأكيد البريد'))}else toast(t('لم يصل التأكيد بعد. افتح الرسالة واضغط الرابط'))}
async function complete(){const nm=$('an').value.trim();if(!nm){toast(t('اكتب اسمك'));return}
 localStorage.setItem('cl_pending',JSON.stringify({role:sr,name:nm,phone:'',code:sr=='worker'&&$('ac')?$('ac').value.trim():'',photo:''}));
 try{await boot()}catch(e){toast(err(e))}setCS();render()}
async function join(){const c=($('jc').value||'').trim().toUpperCase();if(!c)return;
 try{const d=await getDoc(doc(fs,'codes',c));if(!d.exists()){toast(t('الكود غير صحيح'));return}
  await updateDoc(doc(fs,'users',U.uid),{adminId:d.data().adminId,joinCode:c});P.adminId=d.data().adminId;window.LINKED=true;toast('✔ '+t('تم الانضمام إلى المدير'));render()}catch(e){toast(t('تعذر الانضمام'))}}
function shareCode(){window.open('https://wa.me/?text='+encodeURIComponent(t('تمت دعوتك إلى مفكرة عدنان.')+'\n'+location.origin+location.pathname+'\n'+t('أنشئ حساباً واختر «عامل» ثم اكتب كود المدير')+': '+myCode))}
const F=(id,ph,ty,x)=>'<div class="br" style="margin-top:6px"><input id="'+id+'" type="'+(ty||'text')+'" placeholder="'+esc(t(ph))+'"'+(ty=='email'||ty=='password'?' style="direction:ltr;text-align:right"':'')+(x||'')+'></div>';
const B=(c,f,x)=>'<div class="br" style="margin-top:8px"><button class="'+c+'" onclick="'+f+'">'+x+'</button></div>';
function clH(){let h='<div class="pn"><h3>☁️ '+t('الحساب')+'</h3>';
 if(!U){h+='<div class="br"><button class="'+(am=='in'?'bw':'')+'" onclick="cloud.mode(\'in\')">'+t('دخول')+'</button><button class="'+(am=='up'?'bw':'')+'" onclick="cloud.mode(\'up\')">'+t('إنشاء حساب')+'</button></div>';
  if(am=='in')h+=F('ae','البريد الإلكتروني','email')+F('ap','كلمة السر','password')+B('bw','cloud.login()','🔓 '+t('دخول'))+B('','cloud.google()','🔑 '+t('الدخول بحساب Google'))+B('','cloud.forgot()',t('نسيت كلمة السر؟'));
  else h+=F('an','الاسم')+'<div style="margin:10px 0 4px;font-size:13px;color:var(--mut)">'+t('أنا')+':</div><div class="br"><button id="rA" style="padding:16px;font-size:17px" class="'+(sr=='admin'?'bw':'')+'" onclick="cloud.role(\'admin\')">🛡️ '+t('مدير')+'</button><button id="rW" style="padding:16px;font-size:17px" class="'+(sr=='worker'?'bw':'')+'" onclick="cloud.role(\'worker\')">👷 '+t('عامل')+'</button></div>'
   +F('ae','البريد الإلكتروني','email')+F('ap','كلمة السر (6 أحرف فأكثر)','password')+F('aph2','رقم الهاتف (اختياري)','tel')
   +'<div id="cw" style="display:'+(sr=='worker'?'':'none')+'">'+F('ac','كود المدير (اختياري)','text',' style="direction:ltr;text-transform:uppercase"')+'</div>'
   +B('','pk(\'new\')','📷 '+t('صورة شخصية (اختياري)'))+B('bw','cloud.signup()','✅ '+t('إنشاء الحساب'))+'<div style="margin-top:8px;font-size:13px;color:var(--mut)">'+t('سنرسل رسالة إلى بريدك لتأكيده.')+'</div>'}
 else if(needV())h+='<div>📧 '+t('أرسلنا رسالة تأكيد إلى')+' <b dir="ltr">'+esc(U.email)+'</b>. '+t('افتحها واضغط الرابط (وتفقّد الرسائل المزعجة)، ثم اضغط «تحققت».')+'</div>'+B('bw','cloud.check()','✔ '+t('تحققت'))+B('','cloud.resend()',t('أعد إرسال الرسالة'))+B('bh','cloud.out()',t('خروج'));
 else if(needProf)h+='<div>'+t('أكمل حسابك')+':</div>'+F('an','الاسم')+'<div class="br" style="margin-top:8px"><button id="rA" style="padding:16px;font-size:17px" onclick="cloud.role(\'admin\')">🛡️ '+t('مدير')+'</button><button id="rW" style="padding:16px;font-size:17px" class="bw" onclick="cloud.role(\'worker\')">👷 '+t('عامل')+'</button></div><div id="cw">'+F('ac','كود المدير (اختياري)','text',' style="direction:ltr"')+'</div>'+B('bw','cloud.complete()','✅ '+t('إكمال'))+B('bh','cloud.out()',t('خروج'));
 else{h+='<div><b>'+esc((P&&P.name)||'')+'</b> · '+(P?(P.role=='admin'?'🛡️ '+t('مدير'):'👷 '+t('عامل')):'...')+'</div><div dir="ltr" style="color:var(--mut);font-size:13px;text-align:right">'+esc(U.email)+'</div>';
  if(P&&P.role=='admin')h+='<div class="pn" style="margin-top:10px"><div style="font-size:13px;color:var(--mut)">'+t('كود انضمام عمالك')+'</div><div style="font-size:30px;letter-spacing:5px;text-align:center;margin:6px 0" dir="ltr">'+esc(myCode||'...')+'</div>'+B('bw','cloud.shareCode()','💬 '+t('أرسل الدعوة عبر واتساب'))+'</div>';
  else if(P&&!P.adminId)h+='<div class="pn" style="margin-top:10px"><div style="font-size:13px;color:var(--mut)">'+t('لديك كود من مديرك؟')+'</div>'+F('jc','كود المدير','text',' style="direction:ltr;text-transform:uppercase"')+B('by','cloud.join()',t('انضمام'))+'</div>';
  else if(P)h+='<div style="margin-top:8px">✅ '+t('مرتبط بمدير')+'</div>';
  h+='<div class="br" style="margin-top:12px"><button class="bw" onclick="cloud.sync()">🔄 '+t('مزامنة الآن')+'</button><button class="bh" onclick="cloud.out()">'+t('خروج')+'</button></div><div style="margin-top:12px;font-size:12px;color:var(--mut)">'+usageTxt()+'</div><div class="br" style="margin-top:10px"><button onclick="go(\'prv\')">🔐 '+t('الخصوصية والبيانات')+'</button><button class="bh" onclick="cloud.del()">🗑️ '+t('حذف حسابي وبياناتي')+'</button></div>'}
 return h+'</div>'}
function usageTxt(){let u={r:0,w:0};try{u=Object.assign(u,JSON.parse(localStorage.getItem(UK)||'{}'));if(u.d!=today())u={r:0,w:0}}catch(e){}
 return(u.r>20000||u.w>8000?'⚠️ ':'')+'📊 '+t('استهلاك هذا الجهاز اليوم (تقديري)')+': '+t('قراءات')+' '+u.r+' · '+t('كتابات')+' '+u.w+'. '+t('الحد المجاني للمشروع كله تقريباً 50 ألف قراءة و20 ألف كتابة يومياً؛ الاستهلاك الفعلي في Firebase ← Firestore ← Usage.')}
async function delAccount(){
 if(!delAccount.c){delAccount.c=1;toast(t('اضغط مرة ثانية للحذف النهائي'));setTimeout(()=>{delAccount.c=0},5000);return}
 delAccount.c=0;toast(t('جارٍ الحذف...'));
 try{const uid=U.uid,adm=P&&P.role=='admin';P=null;unsubs.forEach(f=>f());unsubs=[];watched.clear();
  const del=async c=>{const q=await getDocs(c);for(const d of q.docs)await deleteDoc(d.ref)};
  await del(collection(fs,'users',uid,'debts'));
  if(adm)await del(query(collection(fs,'codes'),where('adminId','==',uid)));
  await deleteDoc(doc(fs,'users',uid));
  for(const n of['days','notes','approvals','log'])await del(collection(fs,'workers',uid,n));
  await deleteUser(auth.currentUser);localStorage.removeItem('cl_uid');localStorage.removeItem('cl_pending');localStorage.removeItem(UK);resetLocal();render();toast(t('تم حذف حسابك وبياناتك'))}
 catch(e){toast(e.code=='auth/requires-recent-login'?t('لأمانك، سجّل الخروج ثم الدخول من جديد ثم أعد المحاولة'):err(e))}}
PANELS.cl=clH;
window.cloud={del:delAccount,mode,role,signup,login,google,forgot,resend,check,complete,join,shareCode,out:()=>signOut(auth),sync:()=>{lp.j='';push();toast(t('تمت المزامنة'))}};
setCS();render();
